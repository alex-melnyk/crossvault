name: Publish to pub.dev

# Each package is released by its own tag: <package>-v<version>
# e.g. crossvault-v1.0.2, crossvault_ios-v1.0.1
on:
  push:
    tags:
      - 'crossvault*-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev OIDC authentication
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package from tag
        id: pkg
        run: echo "dir=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
      - uses: dart-lang/setup-dart@v1 # configures the OIDC token for pub
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.10
      - working-directory: ${{ steps.pkg.outputs.dir }}
        run: flutter pub get
      - working-directory: ${{ steps.pkg.outputs.dir }}
        run: flutter analyze
      - run: git status --short
      - working-directory: ${{ steps.pkg.outputs.dir }}
        run: flutter pub publish --force
